# ==============================================================================
# SafeWork - Configuração Central
# ==============================================================================

model:
  path: "models/safework_ppe.pt"
  person_model_path: "yolov8n.pt"
  imgsz: 640
  device: null

detection:
  conf_person: 0.25
  conf_ear: 0.08
  conf_glasses: 0.10
  iou: 0.45
  required_ppe: ["ear", "glasses"]
  window: 6
  needed: 4
  class_map:
    helmet: "ear"
    glasses: "glasses"
    person: "person"
    no-helmet: "no_ear"
    no-glasses: "no_glasses"

alert:
  infraction_seconds: 3.0
  cooldown_seconds: 15.0
  beep_freq: 1200
  beep_ms: 350
  beep_count: 3

capture:
  width: 1280
  height: 720

cameras:
  - name: "Câmera 1 (Notebook)"
    source: 0
  - name: "Câmera 2 (Wi-Fi RTSP)"
    source: "rtsp://admin:1507YGOR*@192.168.0.111:554/onvif2"

security:
  manager_password: "admin123"
